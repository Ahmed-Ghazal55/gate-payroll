name: Validate, package and deploy Gate Payroll
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payroll-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    needs: ftps-preflight
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: GateSynthetic_CI_Only_723!
        ports:
          - 1433:1433
    env:
      PAYROLL_TEST_SQL_CONNECTION: Server=localhost,1433;Database=master;User ID=sa;Password=GateSynthetic_CI_Only_723!;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: RiderForm/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund --prefix RiderForm
      - name: Fetch pinned fonts and licenses
        run: python3 scripts/fetch_fonts.py
      - name: Verify release source boundaries
        run: python3 scripts/release_source.py --check
      - name: Verify FTPS lifecycle protections
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Run engine and hosting-security assertions
        run: dotnet test tests/Engine.Tests/Engine.Tests.csproj --nologo --logger "console;verbosity=detailed"
      - name: Build from clean sources
        run: dotnet build Payroll.Api/Payroll.Api.csproj --nologo
      - name: Build private migration tool
        run: dotnet build tools/StoreMigration/StoreMigration.csproj --nologo --warnaserror
      - name: Browser installation
        run: |
          npm install --no-save --prefix /tmp/gate-browser playwright@1.56.1
          /tmp/gate-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser and mobile verification
        run: |
          node tests/browser.mjs
          node tests/browser-v05.mjs
      - name: Publish Linux smoke-test bundle
        run: dotnet publish Payroll.Api/Payroll.Api.csproj -c Release -r linux-x64 --self-contained true -o artifacts/linux --nologo
      - name: Test published application
        run: |
          PAYROLL_TEST_PUBLISHED="$PWD/artifacts/linux" node tests/integration.mjs
          PAYROLL_TEST_PUBLISHED="$PWD/artifacts/linux" node tests/enterprise.mjs
          PAYROLL_TEST_PUBLISHED="$PWD/artifacts/linux" node tests/accounting.mjs
          PAYROLL_TEST_PUBLISHED="$PWD/artifacts/linux" node tests/submissions.mjs
          PAYROLL_TEST_PUBLISHED="$PWD/artifacts/linux" node tests/campaigns.mjs
      - name: Publish MonsterASP bundle
        run: dotnet publish Payroll.Api/Payroll.Api.csproj -c Release -r win-x64 --self-contained true -o artifacts/monsterasp --nologo
      - name: Validate deployment payload
        run: python3 scripts/check_publish.py artifacts/monsterasp
      - name: Upload clean MonsterASP bundle
        uses: actions/upload-artifact@v6
        with:
          name: publish
          path: artifacts/monsterasp/
          include-hidden-files: true
          retention-days: 7
      - name: Prepare IIS for deployment
        id: ftps-prepare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: python3 scripts/monsterasp_ftps.py prepare
      - name: 🚀 Deploy to MonsterASP via FTPS
        id: ftps-deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          server-dir: wwwroot/
          local-dir: artifacts/monsterasp/
          protocol: ftps
          security: strict
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            App_Data/**
            **/App_Data/**
            appsettings.Local.json
            **/appsettings.Local.json
            app_offline.htm
      - name: Resume IIS and verify preserved runtime files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: python3 scripts/monsterasp_ftps.py finish
      - name: Verify live HTTPS release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        run: python3 scripts/monsterasp_ftps.py health
      - name: Verify every published file and HTTPS asset (read only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: python3 scripts/verify_deployed_payload.py
      - name: Save deployment verification evidence
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['ftps-preflight'].result == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: deployment-verification-v070
          path: artifacts/deployment-verification-v070.json
          retention-days: 14
  ftps-preflight:
    name: Check FTPS connection (read only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify FTPS certificate, login and existing root
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: python3 scripts/monsterasp_ftps.py check
