name: Read-only v070 HTTPS asset audit
on:
  push:
    branches: [audit/v070-https]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 52d4e3256485907b5ee8227493f6494c12614ad4
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: publish
          path: artifacts/monsterasp
          repository: Ahmed-Ghazal55/gate-payroll
          run-id: 40304350594
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the deployed v070 bundle without production writes
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          python3 scripts/monsterasp_ftps.py health
          python3 scripts/verify_deployed_payload.py
      - name: Save read-only verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-verification-v070-independent
          path: artifacts/deployment-verification-v070.json
          retention-days: 14
