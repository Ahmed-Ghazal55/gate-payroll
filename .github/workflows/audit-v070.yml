name: Read-only v070 HTTPS asset audit
on:
  push:
    branches: [audit/v070-https]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: publish
          path: artifacts/monsterasp
          repository: Ahmed-Ghazal55/gate-payroll
          run-id: 40304350594
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check every HTTPS asset without production writes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,hashlib,json
          from pathlib import Path
          base='https://payroll.marketingalbawaba.com'
          root=Path('artifacts/monsterasp/wwwroot')
          results=[]
          for path in sorted(root.rglob('*')):
              if not path.is_file():continue
              route='/'+'/'.join(urllib.parse.quote(p) for p in path.relative_to(root).parts)
              request=urllib.request.Request(base+route+'?audit=v070',headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      data=response.read();row={'path':route,'status':response.status,'bytes':len(data),'matches':hashlib.sha256(data).digest()==hashlib.sha256(path.read_bytes()).digest()}
              except Exception as e:row={'path':route,'error':str(e)}
              results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          for route in ['/','/health','/rider-form']:
              try:
                  with urllib.request.urlopen(base+route,timeout=30) as response:print(json.dumps({'probe':route,'status':response.status,'bytes':len(response.read())}))
              except Exception as e:print(json.dumps({'probe':route,'error':str(e)}))
          Path('https-audit-v070.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: https-audit-v070
          path: https-audit-v070.json
